# Publikacja statyki na Cloudflare Pages (konfiguracja darmowa — akt
# operatora 2026-08-08). Sekrety żyją wyłącznie w GitHub Secrets:
# CLOUDFLARE_API_TOKEN (token o zakresie „Cloudflare Pages: Edit")
# i CLOUDFLARE_ACCOUNT_ID; opcjonalna zmienna PUBLIC_ZAPIS_URL wskazuje
# publiczny adres serwisu zapisu. Bez sekretów workflow po prostu
# nie wystartuje — niczego nie udaje.
name: Publikacja statyki (Cloudflare Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run build
        env:
          PUBLIC_ZAPIS_URL: ${{ vars.PUBLIC_ZAPIS_URL }}
      - name: Utwórz projekt Pages (pierwszy raz; potem bez skutku)
        run: npx wrangler pages project create church --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wgraj build
        run: npx wrangler pages deploy dist --project-name=church
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
